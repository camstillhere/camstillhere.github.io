<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Résumé</title>
	<meta name="description" content="An online résumé rendered from a single config.json, with configurable branding.">
	<link rel="stylesheet" href="css/style.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
	<script type="module" src="js/main.js"></script>
</head>
<body>
	<header class="topbar">
		<div class="wrap topbar-inner">
			<a class="wordmark" id="wordmark" href="#top"></a>
			<nav aria-label="Sections">
				<a href="#overview">Profile</a>
				<a href="#proofPoints">Impact</a>
				<a href="#experience" id="nav-experience">Experience</a>
				<a href="#education" id="nav-education">Education</a>
				<a href="#references" id="nav-references">Endorsements</a>
			</nav>
			<div class="controls">
				<button id="themeToggle" class="icon-button" aria-label="Toggle dark mode">◐</button>
				<button id="printButton" class="icon-button" aria-label="Print or save as PDF">⎙</button>
			</div>
		</div>
	</header>

	<section id="hero" class="hero">
		<div class="wrap hero-grid" id="heroGrid"></div>
		<div class="wrap stats" id="stats"></div>
	</section>

	<p id="error" class="wrap error" role="alert" hidden></p>
	<main>
		<section id="overview" class="block"></section>
		<section id="featured" class="band"></section>
		<section id="references" class="block"></section>
		<section id="proofPoints" class="block"></section>
		<section id="principles" class="block"></section>
		<section id="skills" class="block"></section>
		<section id="charts" class="block" hidden>
			<div class="wrap">
				<h2 class="plain-title">At a glance</h2>
				<div class="chart-grid">
					<div class="chart"><canvas id="chartExperience"></canvas></div>
					<div class="chart"><canvas id="chartTenure"></canvas></div>
					<div class="chart"><canvas id="chartEducation"></canvas></div>
					<div class="chart"><canvas id="chartReferences"></canvas></div>
				</div>
			</div>
		</section>
		<section id="experience" class="block"></section>
		<section id="education" class="block"></section>
	</main>

	<footer id="footer" class="footer wrap"></footer>
</body>
</html>
